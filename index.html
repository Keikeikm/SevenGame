
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>逢七过 · Seven Game</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="game">
    <header class="header">
      <div class="logo">SEVEN GAME</div>
      <h1>逢过 🫡</h1>
      <p>两个人的数字默契挑战</p>
    </header>

    <section class="players">
      <div class="player" id="playerA">
        <span class="player-icon">👤</span>
        <span>PLAYER A</span>
        <strong>玩家 A</strong>
      </div>

      <div class="vs">VS</div>

      <div class="player" id="playerB">
        <span class="player-icon">👤</span>
        <span>PLAYER B</span>
        <strong>玩家 B</strong>
      </div>
    </section>

    <section class="game-board">
      <p class="current-label">CURRENT NUMBER</p>
      <div class="number" id="number">1</div>
      <div class="turn" id="turn">轮到玩家 A</div>
      <div class="feedback" id="feedback">
        请报出数字 1
      </div>

      <div class="actions">
        <button id="sayButton" class="action-button say">
          🔢 报数
        </button>
        <button id="saluteButton" class="action-button salute">
          🫡 敬礼
        </button>
      </div>
    </section>

    <!-- <section class="history">
      <h2>游戏记录</h2>
      <div id="historyList" class="history-list">
        <div class="empty">等待游戏开始...</div>
      </div>
    </section> -->

    <section class="footer">
      <button id="restartButton">↻ 重新开始</button>
      <span id="score">连续正确：0</span>
    </section>

  </main>

  <script src="./game.js"></script>
</body>
</html>
